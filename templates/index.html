{% extends "base.html" %}

{% block content %}
<div style="display:flex;justify-content:center;align-items:center;height:60vh;">
  <div style="background:var(--card);padding:30px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);text-align:center;width:400px;">
    <h2>Welcome, {{ email }}!</h2>
    <form method="POST" action="{{ url_for('otp_login') }}">

    <p>You are successfully logged in via OTP.</p>
    
    <div style="margin-top:20px;">
      <a href="{{ url_for('logout') }}" 
         style="padding:10px 20px;background:#d9534f;color:white;border-radius:6px;text-decoration:none;">
        Logout
      </a>
    </div>
  </div>
</div>
{% endblock %}
