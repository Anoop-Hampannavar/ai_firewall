<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Firewall</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #f5f7fb;
            color: #222;
        }

        /* NAVBAR */
        .navbar {
            width: 100%;
            background: #212121;
            padding: 15px 30px;
            box-sizing: border-box;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .navbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
        }
        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 8px 14px;
            background: #333;
            border-radius: 6px;
            transition: 0.2s;
        }
        .navbar a:hover {
            background: #444;
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0px 6px 18px rgba(0,0,0,0.08);
        }

        /* INPUTS & BUTTONS */
        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #aaa;
            font-size: 15px;
            resize: vertical;
        }
        button {
            padding: 12px 20px;
            background: #0069ff;
            border: none;
            color: white;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
        }
        button:hover {
            background: #0053c7;
        }

        /* DASHBOARD CARDS */
        .card-row {
            display: flex;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 230px;
            background: white;
            padding: 20px;
            border-radius: 14px;
            color: white;
            box-shadow: 0px 4px 14px rgba(0,0,0,0.12);
        }
        .blue { background: #247CFF; }
        .green { background: #00B87B; }
        .purple { background: #8A4DFF; }

        .card h3 {
            margin: 0;
            font-size: 20px;
        }
        .card p {
        margin: 5px 0 0;
        font-size: 18px;
        font-weight: bold;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
}


        /* RESULT BOX */
        #result {
            background: #f1f5ff;
            border-left: 5px solid #0069ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>AI Firewall Summarizer</h1>
        {% if session.user %}
        <a href="{{ url_for('logout') }}">Logout</a>
        {% endif %}
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
