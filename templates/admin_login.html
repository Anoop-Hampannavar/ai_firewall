{% extends "base.html" %}
{% block content %}
<div style="display:flex;justify-content:center;align-items:center;height:60vh;">
  <div style="background:white;padding:30px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);width:350px;text-align:center;">
    <h2>Admin Login</h2>
    <form method="POST">
      <input type="email" name="email" placeholder="Admin Email" required style="width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;">
      <input type="password" name="password" placeholder="Password" required style="width:100%;padding:10px;margin:8px 0;border-radius:6px;border:1px solid #ccc;">
      <button type="submit" style="width:100%;padding:10px;border-radius:8px;border:none;background:#007bff;color:white;margin-top:8px;">Login</button>
    </form>
  </div>
</div>
{% endblock %}
